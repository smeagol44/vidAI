name: Worker integration smoke
on:
  pull_request:
    paths:
      - 'observerPreferences.ts'
      - 'tests/observer-preferences.test.ts'
      - 'e2e/observer-preferences.spec.ts'
      - 'simulation.ts'
      - 'tests/nutrient-cycle.test.ts'
      - 'tests/support/nutrient-cycle.ts'
      - 'e2e/nutrient-cycle.spec.ts'
      - 'environmentScenarios.ts'
      - 'tests/environment-scenarios.test.ts'
      - 'tests/support/scenario-browser.ts'
      - 'e2e/environment-scenarios.spec.ts'
      - 'sideWindows.ts'
      - 'worldScene.ts'
      - 'tests/support/tube-presentation.ts'
      - 'SideWindowDemo.tsx'
      - 'sideWindowDemo.css'
      - 'windowDemo.ts'
      - 'selfTubes.ts'
      - 'tests/self-tubes.test.ts'
      - 'tests/support/self-tubes.ts'
      - 'tests/support/self-tube-browser.ts'
      - 'tests/window-demo.test.ts'
      - 'tests/side-windows.test.ts'
      - 'e2e/side-windows.spec.ts'
      - 'simulation.worker.ts'
      - 'energyEconomy.ts'
      - 'energyActivity.ts'
      - 'eggReserve.ts'
      - 'tests/egg-reserve.test.ts'
      - 'tests/support/egg-reserve.ts'
      - 'e2e/egg-reserve.spec.ts'
      - 'tests/energy-activity.test.ts'
      - 'tests/support/energy-activity.ts'
      - 'e2e/energy-activity.spec.ts'
      - 'tests/closed-energy.test.ts'
      - 'mouthGeometry.ts'
      - 'mouthContactAudit.ts'
      - 'tests/mouth-contact.test.ts'
      - 'CreaturePreview.tsx'
      - 'tests/solver-passivity.test.ts'
      - 'solverPassivityAudit.ts'
      - 'foundationPhysics.ts'
      - 'tests/foundation-physics.test.ts'
      - 'scripts/check-worker.mjs'
      - 'App.tsx'
      - 'styles.css'
      - 'e2e/presentation.spec.ts'
      - 'SimulationPerformanceIndicator.tsx'
      - 'simulationPerformance.ts'
      - 'simulationSpeed.ts'
      - 'tests/simulation-performance.test.ts'
      - 'BrainGraph.tsx'
      - 'persistence.ts'
      - 'constants.ts'
      - 'playground_config.json'
      - 'workerPacing.ts'
      - 'playwright.worker-firefox.config.ts'
      - 'tests/worker-pacing.test.ts'
      - 'simulationHost.ts'
      - 'simulationClient.ts'
      - 'e2e/performance-worker.spec.ts'
      - '.github/workflows/performance-worker.yml'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:worker

  # Each Playwright shard has its own runner. Keep one browser worker per runner:
  # concurrent full-tank rendering within one runner exhausts software graphics.
  browser-shards:
    name: browser-shard (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Match the project's pinned @playwright/test version: browsers and OS
    # dependencies are bundled, avoiding per-shard browser archive downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    # GitHub's container HOME points to /github/home (owned by pwuser),
    # while jobs launch browsers as root. Firefox requires matching ownership.
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: side-windows
            browser: chromium
            command: "npx playwright test e2e/side-windows.spec.ts --workers=1"
          - suite: toolbar
            browser: chromium
            command: "npx playwright test e2e/presentation.spec.ts --grep 'toolbar stays' --workers=1"
          - suite: chromium-regressions
            browser: chromium
            command: "npx playwright test e2e/performance-worker.spec.ts e2e/energy-activity.spec.ts e2e/egg-reserve.spec.ts e2e/environment-scenarios.spec.ts e2e/nutrient-cycle.spec.ts e2e/observer-preferences.spec.ts --workers=1"
          - suite: firefox-regressions
            browser: firefox
            command: "npx playwright test --config=playwright.worker-firefox.config.ts --workers=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify preinstalled browser availability
        run: |
          test -d /ms-playwright
          ls -1 /ms-playwright
      - run: npm run build
      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.command }}
      - name: Preserve side-window visual acceptance screenshots
        if: always() && matrix.suite == 'side-windows'
        uses: actions/upload-artifact@v4
        with:
          name: side-window-previews
          path: test-results/**/side-windows-*.png

  # Preserve the previous required check name and fail it if any gate fails.
  browser-smoke:
    runs-on: ubuntu-24.04
    if: always()
    needs: [worker-gate, browser-shards]
    steps:
      - name: Require Worker and every browser shard to pass
        env:
          WORKER_RESULT: ${{ needs.worker-gate.result }}
          BROWSER_RESULT: ${{ needs.browser-shards.result }}
        run: |
          test "$WORKER_RESULT" = success
          test "$BROWSER_RESULT" = success
