name: Worker integration smoke
on:
  pull_request:
    paths:
      - 'simulation.worker.ts'
      - 'workerPacing.ts'
      - 'tests/worker-pacing.test.ts'
      - 'simulationHost.ts'
      - 'simulationClient.ts'
      - 'e2e/performance-worker.spec.ts'
      - '.github/workflows/performance-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:worker
      - run: npx playwright test e2e/performance-worker.spec.ts --workers=1
