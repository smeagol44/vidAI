name: Worker integration smoke
on:
  pull_request:
    paths:
      - 'simulation.worker.ts'
      - 'energyEconomy.ts'
      - 'tests/closed-energy.test.ts'
      - 'mouthGeometry.ts'
      - 'mouthContactAudit.ts'
      - 'tests/mouth-contact.test.ts'
      - 'CreaturePreview.tsx'
      - 'tests/solver-passivity.test.ts'
      - 'solverPassivityAudit.ts'
      - 'foundationPhysics.ts'
      - 'tests/foundation-physics.test.ts'
      - 'scripts/check-worker.mjs'
      - 'App.tsx'
      - 'BrainGraph.tsx'
      - 'persistence.ts'
      - 'constants.ts'
      - 'playground_config.json'
      - 'workerPacing.ts'
      - 'playwright.worker-firefox.config.ts'
      - 'tests/worker-pacing.test.ts'
      - 'simulationHost.ts'
      - 'simulationClient.ts'
      - 'e2e/performance-worker.spec.ts'
      - 'e2e/buildIdentity.ts'
      - '.github/workflows/performance-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    # #96 owner permits only the registered revised-hybrid study; no extra searches/browser campaign.
    if: github.head_ref != 'experiment/uncapped-revised-hybrid-96'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # exact testing iteration needs its pinned baseline history
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Resolve exact testing identity for build and assertions
        if: hashFiles('testing-baseline.json') != ''
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const release = JSON.parse(execFileSync(process.execPath,
            ['scripts/testing-build-info.mjs'], {encoding: 'utf8'}));
          appendFileSync(process.env.GITHUB_ENV, 'VITE_TESTING_RELEASE=' + release.label + '\n');
          NODE
      - run: npm run build
      - run: npm run test:worker
      - run: npx playwright test e2e/performance-worker.spec.ts --workers=1
      - run: npx playwright test --config=playwright.worker-firefox.config.ts --workers=1
