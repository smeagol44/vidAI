name: Publish current VIDA Wiki pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vida-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update only the current feature pages
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "${RUNNER_TEMP}/vida-wiki"
          cp -- docs/wiki/Home.md docs/wiki/Motor-Control.md docs/wiki/Sensory-Behavior.md docs/wiki/Ecology-Baseline.md docs/wiki/Waking-Learning.md docs/wiki/Featured-Starters.md docs/wiki/Simulation-Performance.md docs/wiki/Energy-Activity.md docs/wiki/_Sidebar.md "${RUNNER_TEMP}/vida-wiki/"
          cd "${RUNNER_TEMP}/vida-wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Home.md Motor-Control.md Sensory-Behavior.md Ecology-Baseline.md Waking-Learning.md Featured-Starters.md Simulation-Performance.md Energy-Activity.md _Sidebar.md
          if git diff --cached --quiet; then
            echo "Wiki pages already match the current reference."
            exit 0
          fi
          git commit -m "Update current VIDA feature reference"
          git push origin HEAD
