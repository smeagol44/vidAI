name: Validate and deploy VIDA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended_validation:
        description: Run the full simulation suite and browser checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:fast
      - run: npm run audit:fluid-muscle
      - run: npm test
        if: github.event_name == 'workflow_dispatch' && inputs.extended_validation
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.extended_validation
      - run: npm run test:e2e
        if: github.event_name == 'workflow_dispatch' && inputs.extended_validation
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
