name: Simulation throughput diagnosis
on:
  pull_request:
    paths:
      - 'scripts/profile-performance.mjs'
      - 'simulation.ts'
      - 'contacts.ts'
      - 'neuralRuntime.ts'
      - 'simulationHost.ts'
      - 'lineageChanges.ts'
      - 'world.ts'
      - 'scripts/benchmark-runtime-components.mjs'
      - 'simulation.worker.ts'
      - 'workerPacing.ts'
      - '.github/workflows/performance-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/contact-learning-lineage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          ref: 03a48027b822a552a32306af90a113fa4c4ff3e8
          path: performance-baseline
      - name: Profile v0.32.0 baseline
        run: node --import tsx scripts/profile-performance.mjs performance-baseline baseline-profile.json
      - name: Profile candidate
        run: node --import tsx scripts/profile-performance.mjs . candidate-profile.json
      - name: Compare complete workload states and timings
        run: node scripts/compare-performance.mjs baseline-profile.json candidate-profile.json
      - name: Verify exact kernel continuation against v0.32.0
        run: npm run benchmark:performance -- --baseline performance-baseline
      - name: Compare collision, learning and long-history transport components
        run: node --import tsx scripts/benchmark-runtime-components.mjs performance-baseline
